name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      # Actions pinned to full commit SHAs (tag in the comment).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18.0"
      - name: Install Python dependencies (hash-locked, requirements/ci.txt)
        run: python -m pip install --require-hashes -r requirements/ci.txt
      - name: Vector checksums
        working-directory: test-vectors
        run: sha256sum -c ../conformance/VECTORS.sha256
      - name: Vectors reproduce from the generator
        working-directory: python
        run: python -m agit8or_connect.tools.generate_vectors --check
      - name: Schemas in step with OpenAPI
        run: python tools/build_schemas.py --check
      - name: Python SDK tests
        working-directory: python
        run: python -m unittest discover -v
      - name: TypeScript SDK tests
        working-directory: typescript
        run: npm test
      - name: Conformance suite
        working-directory: conformance
        env:
          CONFORMANCE_REQUIRE_NODE: "1"
        run: python -m unittest discover -v
      - name: Examples
        run: |
          (cd python && python ../examples/python/quick_connect_peers.py)
          node examples/typescript/quick_connect_messages.ts

  postgres:
    # Runs the shared-store tests (replay, rate limits, destinations, approvals, concurrent workers)
    # against a real PostgreSQL. This is the only place PostgreSQL evidence comes from.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connect
          POSTGRES_PASSWORD: connect-ci-only
          POSTGRES_DB: connect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U connect -d connect_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements/postgres.txt
      - name: Storage tests on PostgreSQL
        working-directory: python
        env:
          AGIT8OR_CONNECT_TEST_POSTGRES_DSN: "postgresql://connect:connect-ci-only@127.0.0.1:5432/connect_test"
          AGIT8OR_CONNECT_REQUIRE_POSTGRES: "1"
        run: python -m unittest -v agit8or_connect.tests.test_storage
